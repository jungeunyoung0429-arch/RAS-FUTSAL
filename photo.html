<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>베스트컷 · 2026 RAS 풋살</title>
<meta name="theme-color" content="#101412">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="sub.css">
<style>.skip{position:absolute;z-index:30;top:-100px;left:10px;background:var(--lime);color:var(--lime-ink);padding:10px 14px;font-weight:800}.skip:focus{top:6px}
.drop{border:1.5px dashed #46513f;border-radius:var(--r);background:var(--field);padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s}
.drop:hover{border-color:var(--lime)}
.drop b{display:block;font-size:15.5px;font-weight:850;color:var(--lime);margin-bottom:4px}
.drop span{font-size:12.5px;color:var(--mute);font-weight:550;line-height:1.6}
.drop.has{border-style:solid;border-color:var(--lime);padding:10px}
.drop img{max-width:100%;border-radius:4px;display:block;margin:0 auto}
.drop .again{margin-top:9px;font-size:12.5px;font-weight:700;color:var(--mute)}
#file{display:none}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ph{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;min-width:0}
.ph.best{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp)}
.ph .im{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#202821;cursor:zoom-in}
.ph .bd{padding:10px 11px 11px}
.ph .tt{font-size:13.5px;font-weight:850;letter-spacing:-.01em}
.ph .tt i{font-style:normal;font-size:11px;font-weight:600;color:var(--mute);margin-left:4px}
.ph .cp{margin:4px 0 0;font-size:12px;color:var(--mute);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph .hb{margin-top:9px;width:100%;padding:9px;border:1px solid var(--line);border-radius:5px;background:var(--field);font-size:13px;font-weight:800;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:5px}
.ph .hb.on{border-color:var(--heart);background:#36161f;color:var(--heart)}
.ph .crown{position:absolute;top:8px;left:8px;background:var(--lamp);color:#3a2800;font-size:11px;font-weight:900;padding:4px 8px;border-radius:3px}
.lb{position:fixed;inset:0;z-index:90;background:rgba(6,9,7,.94);display:none;align-items:center;justify-content:center;padding:18px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:78vh;border-radius:4px;display:block}
.lb .cap{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;color:#dfe6dc;font-size:13.5px;font-weight:650;padding:0 20px;line-height:1.6}
.lb .x{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:40px;height:40px;border:1px solid #4a544c;border-radius:50%;background:#1a201d;color:#fff;font-size:18px;line-height:1}
@media (min-width:700px){.g{grid-template-columns:repeat(3,1fr);gap:12px}}
</style>

<a class="skip" href="#main">본문 바로가기</a>
<div class="top"><div class="in"><a class="brand" href="/" aria-label="RAS FUTSAL 메인으로"><i class="mark" aria-hidden="true"><b></b><b></b><b></b></i>RAS FUTSAL</a>
<nav aria-label="바로가기"><a class="home" href="/#join">함께하기</a><a class="lv" href="/live"><i aria-hidden="true">◉</i>라이브 센터</a></nav></div></div>
<header class="phd" id="main"><div class="in">
  <div class="label"><i></i>PHOTO <em>/</em> 2026 RAS FESTA</div>
  <h1>우리 팀 베스트컷<span>.</span></h1>
  <p>경기 중 찍은 사진을 올려 주세요. 선생님 확인을 거쳐 공개되고, 가장 많은 하트를 받은 사진은 베스트컷으로 시상합니다.</p>
</div></header>

<div class="tabs"><div class="in">
  <button data-t="up">사진 올리기</button>
  <button data-t="gal">베스트컷 갤러리</button>
</div></div>

<div class="wrap" id="app"></div>
<div class="lb" id="lb"><button class="x" id="lbx">✕</button><img id="lbi" alt=""><div class="cap" id="lbc"></div></div>
<footer>안산교육지원청 · 안산학교체육지원단</footer>

<script>
const SCHOOLS = {"고잔고":["고등남"],"관산중":["중등남"],"광덕고":["고등남"],"국비고":["고등여"],"단원고":["고등남"],"동산고":["고등남","고등여"],"별망중":["중등여"],"본오중":["중등남","중등여"],"부곡중":["중등남","중등여"],"선부고":["고등여"],"선부중":["중등남"],"선일중":["중등남","중등여"],"성안고":["고등남"],"성호중":["중등남"],"송호고":["고등남"],"신길고":["고등남"],"안산공고":["고등남"],"양지고":["고등남","고등여"],"원곡고":["고등남","고등여"],"원곡중":["중등남","중등여"],"원일중":["중등남"],"이호중":["중등남","중등여"],"중앙중":["중등남"],"초지고":["고등남","고등여"],"해솔중":["중등남","중등여"]};
const DIVNAME = { 중등남:"중등부 남자", 중등여:"중등부 여자", 고등남:"고등부 남자", 고등여:"고등부 여자" };
const DIVSHORT = { 중등남:"중등남", 중등여:"중등여", 고등남:"고등남", 고등여:"고등여" };

const MAXEDGE = 1440;     // 긴 쪽 기준 픽셀
const TARGET  = 480_000;  // 목표 용량 (바이트)
const VOTEKEY = "ras_photo_votes";

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const votes = {
  all(){ try{ return JSON.parse(localStorage.getItem(VOTEKEY) || "{}"); }catch(e){ return {}; } },
  has(id){ return !!this.all()[id]; },
  add(id){ try{ const v = this.all(); v[id] = 1; localStorage.setItem(VOTEKEY, JSON.stringify(v)); }catch(e){} },
  del(id){ try{ const v = this.all(); delete v[id]; localStorage.setItem(VOTEKEY, JSON.stringify(v)); }catch(e){} }
};

let tab = "up", refs = {}, loaded = false;
let pick = null;                              // { dataUrl, type, bytes }
const F = { school:"", div:"", by:"", cap:"" };

/* ───────── 사진 줄이기 ───────── */
function shrink(file){
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onerror = () => no(new Error("read"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => no(new Error("decode"));
      img.onload = () => {
        const sc = Math.min(1, MAXEDGE / Math.max(img.width, img.height));
        const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        let q = 0.82, url = cv.toDataURL("image/jpeg", q);
        while(url.length * 0.75 > TARGET && q > 0.4){
          q -= 0.1; url = cv.toDataURL("image/jpeg", q);
        }
        ok({ dataUrl:url, type:"image/jpeg", bytes: Math.round(url.length * 0.75) });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ───────── 데이터 ───────── */
async function load(){
  try{
    const r = await fetch("/api/data?cb=" + Date.now());
    const d = await r.json();
    refs = d.refs || {};
  }catch(e){ refs = {}; }
  loaded = true;
}
const photos = () => Object.entries(refs)
  .filter(([,v]) => v && v.kind === "photo")
  .map(([id,v]) => ({ id, ...v }));
const voteCount = id => Object.values(refs)
  .filter(v => v && v.kind === "vote" && v.photo === id).length;

/* ───────── 화면 ───────── */
function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  (tab === "up" ? renderUp : renderGal)();
}

function divOpts(){
  const ds = SCHOOLS[F.school] || [];
  if(!ds.includes(F.div)) F.div = ds.length === 1 ? ds[0] : "";
  return ds;
}

function renderUp(){
  const ds = divOpts();
  $("#app").innerHTML = `
  <div class="card">
    <h3>어떤 사진인가요?</h3>
    <div class="sub">경기 장면, 우리 팀 단체 사진, 응원하는 모습 모두 좋습니다.
      한 번에 한 장씩 올리고, 여러 장이면 다시 올리시면 됩니다.</div>
    <div class="ff">
      <label>학교</label>
      <select id="fSchool"><option value="">학교를 고르세요</option>
        ${Object.keys(SCHOOLS).map(s =>
          `<option value="${esc(s)}"${s===F.school?" selected":""}>${esc(s)}</option>`).join("")}
      </select>
    </div>
    ${ds.length > 1 ? `<div class="ff"><label>부문</label>
      <select id="fDiv"><option value="">부문을 고르세요</option>
        ${ds.map(d => `<option value="${esc(d)}"${d===F.div?" selected":""}>${esc(DIVNAME[d])}</option>`).join("")}
      </select></div>`
      : (ds.length === 1 ? `<div class="ff"><label>부문</label>
        <input value="${esc(DIVNAME[ds[0]])}" disabled></div>` : "")}
    <div class="ff">
      <label>올린 사람<em>이름</em></label>
      <input id="fBy" value="${esc(F.by)}" placeholder="이름" autocomplete="off">
    </div>
    <div class="ff">
      <label>한 줄 설명<em>선택</em></label>
      <input id="fCap" value="${esc(F.cap)}" placeholder="예) 결승골 넣고 다같이 뛰어간 순간" maxlength="60">
    </div>
  </div>

  <div class="card">
    <h3>사진 고르기</h3>
    <div class="sub">올릴 때 자동으로 용량을 줄입니다. 원본 그대로 두셔도 됩니다.</div>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/*">
    <div class="drop ${pick ? "has" : ""}" id="drop">
      ${pick
        ? `<img src="${pick.dataUrl}" alt="고른 사진"><div class="again">다시 고르려면 누르세요 · ${Math.round(pick.bytes/1024)}KB</div>`
        : `<b>사진 고르기</b><span>눌러서 앨범에서 고르거나<br>바로 촬영할 수 있습니다</span>`}
    </div>
    <button class="send" id="send">올리기</button>
    <div class="hintbar" id="hint"></div>
  </div>

  <p class="priv">올린 사진은 바로 공개되지 않습니다. 담당 선생님이 확인한 뒤 갤러리에 올라갑니다.
    사진은 이 대회 기록과 결과 보고에만 쓰고, 참가 학생 초상권 동의 범위 안에서만 공개합니다.
    내리고 싶은 사진이 있으면 담당 선생님께 말씀해 주세요.</p>`;

  const sc = $("#fSchool");
  sc.onchange = () => { F.school = sc.value; F.div = ""; render(); };
  const dv = $("#fDiv"); if(dv) dv.onchange = () => { F.div = dv.value; };
  $("#fBy").oninput  = e => { F.by  = e.target.value; };
  $("#fCap").oninput = e => { F.cap = e.target.value; };

  $("#drop").onclick = () => $("#file").click();
  $("#file").onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    $("#hint").className = "hintbar"; $("#hint").textContent = "사진을 줄이는 중…";
    try{
      pick = await shrink(f);
      $("#hint").textContent = "";
      render();
    }catch(err){
      pick = null;
      $("#hint").textContent = "이 사진은 열 수 없습니다. 다른 사진으로 해 주세요.";
    }
    e.target.value = "";
  };
  $("#send").onclick = upload;
}

async function upload(){
  const hint = $("#hint"), btn = $("#send");
  hint.className = "hintbar";
  const ds = SCHOOLS[F.school] || [];
  if(!F.school)              return hint.textContent = "학교를 골라 주세요.";
  if(ds.length > 1 && !F.div) return hint.textContent = "부문을 골라 주세요.";
  if(!F.by.trim())           return hint.textContent = "올린 사람 이름을 적어 주세요.";
  if(!pick)                  return hint.textContent = "사진을 골라 주세요.";
  hint.textContent = "";
  btn.disabled = true; btn.textContent = "올리는 중…";

  const div = F.div || ds[0] || "";
  try{
    const r1 = await fetch("/api/upload", { method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ data: pick.dataUrl, type: pick.type, school: F.school }) });
    const j1 = await r1.json();
    if(!j1.ok) throw new Error(j1.msg || "upload");

    const r2 = await fetch("/api/data", { method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ type:"ref", request:true,
        id: "P" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        value: { kind:"photo", url: j1.url, school: F.school, div,
                 by: F.by.trim(), cap: F.cap.trim(), status:"대기" } }) });
    const j2 = await r2.json();
    if(!j2.ok) throw new Error(j2.msg || "save");

    pick = null; F.cap = "";
    btn.disabled = false;
    render();
    const h = $("#hint");
    h.className = "hintbar ok";
    h.textContent = "올렸습니다. 선생님 확인 뒤 갤러리에 올라갑니다.";
    window.scrollTo({ top:0, behavior:"smooth" });
  }catch(e){
    btn.disabled = false; btn.textContent = "올리기";
    hint.textContent = "올리지 못했습니다. 잠시 뒤 다시 눌러 주세요.";
  }
}

function renderGal(){
  if(!loaded){ $("#app").innerHTML = `<div class="emptybox">불러오는 중…</div>`; return; }
  const open = photos().filter(p => p.status === "공개" || p.status === "베스트");
  if(!open.length){
    $("#app").innerHTML = `<div class="emptybox"><b>아직 공개된 사진이 없습니다.</b><br>
      사진을 올리면 선생님 확인을 거쳐 이곳에 올라옵니다.<br>
      우리 팀 사진을 가장 먼저 올려 보세요.</div>`;
    return;
  }
  const rows = open.map(p => ({ ...p, n: voteCount(p.id) }))
    .sort((a,b) => (b.status === "베스트") - (a.status === "베스트")
                || b.n - a.n
                || String(b.at||"").localeCompare(String(a.at||"")));

  $("#app").innerHTML = `
    <p class="priv" style="margin-top:13px">마음에 드는 사진에 하트를 눌러 주세요.
      한 사진에 한 번만 누를 수 있고, 하트가 가장 많은 사진이 베스트컷 후보가 됩니다.</p>
    <div class="g">${rows.map(p => `
      <div class="ph ${p.status === "베스트" ? "best" : ""}">
        ${p.status === "베스트" ? `<div class="crown">베스트컷</div>` : ""}
        <img class="im" src="${esc(p.url)}" alt="${esc(p.school)} 사진"
             loading="lazy" data-full="${esc(p.url)}" data-cap="${esc(p.cap || "")}">
        <div class="bd">
          <div class="tt">${esc(p.school)}<i>${esc(DIVSHORT[p.div] || p.div || "")}</i></div>
          ${p.cap ? `<p class="cp">${esc(p.cap)}</p>` : ""}
          <button class="hb ${votes.has(p.id) ? "on" : ""}" data-v="${esc(p.id)}">
            <span>${votes.has(p.id) ? "♥" : "♡"}</span><span>${p.n}</span></button>
        </div>
      </div>`).join("")}</div>`;

  document.querySelectorAll(".im").forEach(im => im.onclick = () => {
    $("#lbi").src = im.dataset.full;
    $("#lbc").textContent = im.dataset.cap || "";
    $("#lb").classList.add("on");
  });
  document.querySelectorAll(".hb").forEach(b => b.onclick = () => heart(b));
}

async function heart(btn){
  const id = btn.dataset.v;
  if(votes.has(id)) return;           /* 한 번만 */
  votes.add(id);
  btn.classList.add("on");
  btn.children[0].textContent = "♥";
  btn.children[1].textContent = String(+btn.children[1].textContent + 1);
  const vid = "V" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  try{
    const r = await fetch("/api/data", { method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ type:"ref", request:true, id:vid,
                             value:{ kind:"vote", photo:id } }) });
    const j = await r.json();
    if(!j.ok) throw new Error("fail");
    refs[vid] = { kind:"vote", photo:id };
  }catch(e){
    votes.del(id);
    btn.classList.remove("on");
    btn.children[0].textContent = "♡";
    btn.children[1].textContent = String(Math.max(0, +btn.children[1].textContent - 1));
  }
}

$("#lbx").onclick = () => $("#lb").classList.remove("on");
$("#lb").onclick = e => { if(e.target.id === "lb") $("#lb").classList.remove("on"); };
document.addEventListener("keydown", e => {
  if(e.key === "Escape") $("#lb").classList.remove("on");
});
document.querySelectorAll(".tabs button").forEach(b =>
  b.onclick = async () => {
    tab = b.dataset.t;
    if(tab === "gal"){ render(); await load(); }
    render();
  });

if(location.hash === "#gal") tab = "gal";
render();
load().then(render);
</script>
</html>
