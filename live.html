<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실시간 현황 · 2026 RAS 풋살</title>
<style>
:root{
  --bg:#07251B; --card:#0E3B2E; --card2:#0A3125; --line:#1C5742;
  --ink:#F2FBF6; --mute:#8FBBA6; --grn:#0BC463; --lamp:#FFC53D; --live:#FF4D4D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.4;padding-bottom:28px;overflow-x:hidden}

header{padding:14px 16px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:17px;font-weight:900;letter-spacing:-.02em}
h1 span{display:block;font-size:10.5px;font-weight:800;color:var(--grn);letter-spacing:.1em;margin-bottom:3px}
.clock{margin-left:auto;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{width:100%;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--mute)}
.sub .dot{width:7px;height:7px;border-radius:50%;background:var(--grn);animation:bl 1.6s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}

.dates{display:flex;gap:6px;overflow-x:auto;padding:11px 16px 0;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 auto;padding:7px 13px;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--mute);font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.dates button.on{background:var(--grn);border-color:var(--grn);color:#06301F}

.grid{display:grid;grid-template-columns:1fr;gap:11px;padding:13px 16px 0;max-width:1500px;margin:0 auto}
@media(min-width:720px){ .grid{grid-template-columns:1fr 1fr;gap:14px;padding:16px} }
@media(min-width:1180px){ .grid{gap:18px} h1{font-size:21px} .clock{font-size:34px} }

.ct{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column}
.ct.on{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.cth{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--card2);
  border-bottom:1px solid var(--line)}
.cth em{font-style:normal;width:26px;height:26px;border-radius:7px;background:var(--grn);color:#06301F;
  display:grid;place-items:center;font-size:15px;font-weight:900;flex:0 0 auto}
.cth .nm{font-size:13.5px;font-weight:800}
.cth .st{margin-left:auto;font-size:10.5px;font-weight:900;padding:3px 9px;border-radius:20px;
  background:#174433;color:var(--mute);letter-spacing:.02em;white-space:nowrap}
.ct.on .cth em{background:var(--live);color:#fff}
.ct.on .cth .st{background:var(--live);color:#fff}
.ct.done .cth .st{background:#1F6B4C;color:#B8E8CE}

.body{padding:16px 13px;flex:1;display:flex;flex-direction:column;justify-content:center}
.tm{font-size:11.5px;font-weight:800;color:var(--mute);text-align:center;margin-bottom:11px;
  letter-spacing:.02em}
.row{display:flex;align-items:center;gap:8px}
.tname{flex:1;font-size:17px;font-weight:800;text-align:center;letter-spacing:-.03em;
  word-break:keep-all;line-height:1.25}
.sc{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;min-width:50px;text-align:center;
  line-height:1;letter-spacing:-.04em}
.sep{font-size:24px;font-weight:900;color:var(--line)}
.ct.on .sc{color:var(--lamp)}
@media(min-width:1180px){ .sc{font-size:62px;min-width:72px} .tname{font-size:22px} }

.gl{margin-top:13px;border-top:1px solid var(--line);padding-top:10px;
  display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.gl span{font-size:11px;font-weight:700;color:var(--mute);background:#0A3125;
  padding:3px 8px;border-radius:14px;white-space:nowrap}
.gl span b{color:var(--ink);font-weight:800}
.empty{text-align:center;color:var(--mute);font-size:13px;font-weight:700;padding:22px 0}

.next{padding:9px 13px;border-top:1px solid var(--line);background:var(--card2);
  font-size:11.5px;font-weight:700;color:var(--mute);text-align:center}
.next b{color:var(--ink);font-weight:800}

.foot{max-width:1500px;margin:16px auto 0;padding:0 16px;display:flex;gap:9px;flex-wrap:wrap}
.top{max-width:1500px;margin:16px auto 0;padding:0 16px}
.tophd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.tophd h3{margin:0;font-size:15px;font-weight:900;letter-spacing:-.01em}
.tophd h3::before{content:"⚽";margin-right:6px}
.dtabs{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.dtabs button{padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;
  color:var(--mute);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.dtabs button.on{background:var(--lamp);border-color:var(--lamp);color:#3A2B00}
.toptb{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.trow{display:flex;align-items:center;gap:9px;padding:11px 12px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .rk{flex:0 0 22px;text-align:center;font-weight:900;color:var(--mute);font-size:13px}
.trow .rk.m1{color:#FFD34D}.trow .rk.m2{color:#D6E4DC}.trow .rk.m3{color:#E0A36A}
.trow .nm{flex:1 1 auto;min-width:0;font-weight:800;font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tmn{flex:0 0 auto;color:var(--mute);font-size:12.5px;white-space:nowrap}
.trow .gn{flex:0 0 46px;text-align:right;white-space:nowrap;font-size:11px;color:var(--mute);margin:0;border:0;padding:0}
.trow .gn b{font-size:17px;font-weight:900;color:var(--grn);margin-right:2px}
.topft{font-size:11.5px;color:var(--mute);margin-top:7px;padding-left:2px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 14px;
  font-size:12.5px;font-weight:800;color:var(--mute)}
.pill b{color:var(--ink);font-size:15px;margin-left:5px}
.err{margin:14px 16px 0;padding:11px 14px;border-radius:11px;background:#5A1A1A;
  font-size:12.5px;font-weight:700;color:#FFD9D9;display:none}
.err.on{display:block}
.ytwrap{max-width:1500px;margin:14px auto 0;padding:0 16px}
.ythd{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;color:var(--mute);
  margin-bottom:8px;flex-wrap:wrap}
.ythd b{color:var(--ink)}
.ythd span{background:var(--live);color:#fff;font-size:10.5px;font-weight:900;padding:2px 9px;border-radius:20px}
.ythd a{margin-left:auto;color:var(--grn);text-decoration:none;font-size:12.5px;font-weight:800}
.yt{position:relative;width:100%;padding-top:56.25%;border-radius:14px;overflow:hidden;
  background:#000;border:1px solid var(--line)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(min-width:1180px){ .ytwrap{max-width:900px} }
.rp{display:block;padding:9px 13px;border-top:1px solid var(--line);background:#0A3125;
  font-size:12px;font-weight:800;color:var(--grn);text-decoration:none;text-align:center}
.rp:active{background:#0D3B2C}
</style>

<header>
  <h1><span>2026 RAS FESTA · 학생주도 풋살</span>실시간 현황</h1>

const COURT = ["", "A", "B", "C", "D"];
const YEAR = 2026;
let scores = {}, logs = {}, days = {}, date = "", pinned = false, failed = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dnum = d => { const [m, x] = d.split("/").map(Number); return m * 100 + x; };

const DATES = [...new Set(DATA.matches.map(m => m.date))].sort((a,b) => dnum(a) - dnum(b));
const DOW = {}; DATA.matches.forEach(m => DOW[m.date] = m.dow);

/* "17:30~17:45" → 분 단위 [시작, 끝] */
function span(t){
  const [a, b] = t.split("~");
  const mm = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  return [mm(a), mm(b)];
}
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const todayStr = () => { const d = new Date(); return (d.getMonth()+1) + "/" + d.getDate(); };

/* 오늘이 경기일이면 오늘, 아니면 다음 경기일 */
function pickDate(){
  const t = todayStr();
  if(DATES.includes(t)) return t;
  const n = dnum(t);
  return DATES.find(d => dnum(d) >= n) || DATES[DATES.length - 1];
}

async function load(){
  try{
    const r = await fetch("/api/data", { cache: "no-store" });
    if(!r.ok) throw 0;
    const d = await r.json();
    scores = d.scores || {}; logs = d.logs || {}; days = d.days || {};
    failed = 0; $("#err").classList.remove("on");
  }catch(e){
    failed++;
    if(failed > 1) $("#err").classList.add("on");
  }
  render();
}

function tick(){
  const d = new Date();
  $("#clk").textContent =
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function dates(){
  $("#dates").innerHTML = DATES.map(d =>
    `<button data-d="${d}" class="${d===date?'on':''}">${d}(${DOW[d]})</button>`).join("");
  $("#dates").querySelectorAll("button").forEach(b =>
    b.onclick = () => { date = b.dataset.d; pinned = true; dates(); render(); });
}


/* ───────── 유튜브 중계 ───────── */
const liveKey = d => d + "|_live";
const mm = t => { const [h,m] = String(t).split(":").map(Number); return h*60 + (m||0); };

/* 그 경기가 속한 중계(오전/오후)를 찾아 영상ID와 시작 분을 돌려줍니다 */
function streamOf(m){
  const v = days[liveKey(m.date)] || {};
  const st = span(m.time)[0];
  const cands = [];
  if(v.v1) cands.push({ id:v.v1, from: v.t1 ? mm(v.t1) : 0 });
  if(v.v2) cands.push({ id:v.v2, from: v.t2 ? mm(v.t2) : 0 });
  if(!cands.length) return null;
  const ok = cands.filter(c => st >= c.from).sort((a,b) => b.from - a.from);
  return ok[0] || null;
}
function replayUrl(m){
  const s = streamOf(m); if(!s) return "";
  const off = Math.max(0, (span(m.time)[0] - s.from) * 60 - 15);  // 15초 여유
  return `https://youtu.be/${s.id}?t=${off}`;
}
/* 지금 시각에 해당하는 중계 */
function currentStream(){
  const v = days[liveKey(date)] || {};
  const n = nowMin();
  const cands = [];
  if(v.v1) cands.push({ id:v.v1, from: v.t1 ? mm(v.t1) : 0, label:(v.v2?"오전":"중계") });
  if(v.v2) cands.push({ id:v.v2, from: v.t2 ? mm(v.t2) : 0, label:"오후" });
  if(!cands.length) return null;
  if(date !== todayStr()) return cands[0];
  const ok = cands.filter(c => n >= c.from - 20).sort((a,b) => b.from - a.from);
  return ok[0] || cands[0];
}
function playerHtml(){
  const s = currentStream();
  if(!s) return "";
  return `<div class="ytwrap"><div class="ythd">📺 <b>실시간 중계</b>
      <span>${esc(s.label)}</span>
      <a href="https://youtu.be/${esc(s.id)}" target="_blank" rel="noopener">유튜브에서 크게 보기 ↗</a></div>
    <div class="yt"><iframe src="https://www.youtube.com/embed/${esc(s.id)}?rel=0"
      title="실시간 중계" frameborder="0" allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe></div>
  </div>`;
}

/* ───── 득점왕 실시간 순위 ───── */
let topDiv = "";
const DIVLABEL = { "중등남":"중등부 남", "중등여":"중등부 여", "고등남":"고등부 남", "고등여":"고등부 여" };

/* ───── 등번호 → 이름 해석 (부문별로 구분) ─────
   같은 학교라도 남자부·여자부는 다른 팀이므로 따로 관리합니다. */
const PNAMES = {
  "중등남|원곡중": { "6":"이준", "7":"이담", "10":"진승연", "17":"윤하율" },
  "중등남|본오중": { "5":"MUCO CHRIST RABY", "6":"김지현", "7":"전유담", "8":"정민준" },
  "중등남|중앙중": { "8":"공선우", "21":"이윤기", "99":"문주원" },
  "중등남|해솔중": { "4":"김민규", "8":"김진우", "11":"박주원" },
  "중등여|이호중": { "7":"김보미", "8":"남지우", "15":"윤설" },
  "중등여|별망중": { "6":"전하은", "10":"최단" },
  "중등여|해솔중": { "2":"주소율", "6":"황채윤", "7":"김다율", "12":"김보민" },
  "중등여|본오중": { "4":"김지윤" },
  "중등여|선일중": { "9":"아리아나" },
  "중등여|부곡중": { "5":"손민서" },
  "중등여|원곡중": { "7":"한채윤", "12":"김나연" }
};
/* 「8」 「8번」 「8. 공선우」 「해솔 12번 김보민」 모두 같은 형식으로 읽습니다 */
const PRE = /^\s*\D{0,6}?(\d{1,3})\s*번?\s*[.·,]?\s*/;
const pNo   = s => { const m = String(s||"").match(PRE); return m ? m[1] : null; };
const pRest = s => String(s||"").replace(PRE, "").replace(/^번\s*/, "").trim();
const tKey  = (div, team) => div + "|" + team;

/* 모든 기록을 훑어 부문·팀·등번호별 이름 사전을 만듭니다 */
function nameBook(){
  const bk = {};
  const put = (k, no, nm) => {
    if(!k || !no || !nm) return;
    bk[k] = bk[k] || {};
    if(!bk[k][no]) bk[k][no] = nm;
  };
  Object.entries(PNAMES).forEach(([k, o]) => Object.entries(o).forEach(([n, v]) => put(k, n, v)));
  DATA.matches.forEach(m => {
    const L = logs[m.id]; if(!L) return;
    [...(L.goals||[]), ...(L.cards||[])].forEach(g => {
      const team = g.t === 1 ? m.t1 : m.t2;
      put(tKey(m.div, team), pNo(g.name), pRest(g.name));
    });
  });
  return bk;
}
/* 저장된 문자열 → { key, label } */
function who(bk, div, team, raw){
  const no = pNo(raw), rest = pRest(raw);
  if(!no) return { key: String(raw||"").trim(), label: String(raw||"").trim() };
  const k = tKey(div, team);
  const nm = rest || (bk[k] && bk[k][no]) || "";
  return { key: no, label: nm ? `${no} ${nm}` : `${no}번` };
}

function scorerTable(){
  const bk = nameBook(), t = {};
  DATA.matches.forEach(m => {
    (logs[m.id]?.goals || []).forEach(g => {
      if(!String(g.name || "").trim()) return;
      const team = g.t === 1 ? m.t1 : m.t2;
      const w = who(bk, m.div, team, g.name);
      const k = m.div + "|" + team + "|" + w.key;
      t[k] = t[k] || { div:m.div, team, name:w.label, n:0 };
      t[k].n++;
    });
  });
  const rows = Object.values(t);
  rows.sort((a, b) => b.n - a.n || a.team.localeCompare(b.team, "ko") || a.name.localeCompare(b.name, "ko"));
  return rows;
}

function scorerHtml(){
  const rows = scorerTable();
  if(!rows.length) return "";
  const divs = [...new Set(rows.map(r => r.div))];
  if(!topDiv || !divs.includes(topDiv)) topDiv = divs[0];
  const mine = rows.filter(r => r.div === topDiv).slice(0, 12);

  // 공동 순위
  let rank = 0, prev = null, shown = 0;
  const body = mine.map(r => {
    shown++;
    if(r.n !== prev){ rank = shown; prev = r.n; }
    const medal = rank <= 3 ? `m${rank}` : "";
    return `<div class="trow">
      <span class="rk ${medal}">${rank}</span>
      <span class="nm">${esc(r.name)}</span>
      <span class="tmn">${esc(r.team)}</span>
      <span class="gn"><b>${r.n}</b>골</span>
    </div>`;
  }).join("");

  return `
  <section class="top">
    <div class="tophd">
      <h3>득점왕 순위</h3>
      <div class="dtabs">${divs.map(d =>
        `<button data-sd="${esc(d)}" class="${d === topDiv ? 'on' : ''}">${esc(DIVLABEL[d] || d)}</button>`).join("")}</div>
    </div>
    <div class="toptb">${body}</div>
    <div class="topft">기록지에 입력된 득점만 집계됩니다 · 대회 전체 누적</div>
  </section>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-sd]");
  if(!b) return;
  topDiv = b.dataset.sd;
  $("#scorers").innerHTML = scorerHtml();
});

function render(){
  const today = (date === todayStr());
  const n = nowMin();
  const all = DATA.matches.filter(m => m.date === date);
  const courts = [...new Set(all.map(m => m.court))].sort();

  $("#sub").textContent =
    `${date}(${DOW[date]||""}) · ${all.length}경기` +
    (today ? " · 12초마다 자동 갱신" : " · 오늘이 아닙니다");

  $("#yt").innerHTML = playerHtml();

  $("#grid").innerHTML = courts.length
    ? courts.map(c => card(c, all.filter(m => m.court === c), today, n)).join("")
    : `<div class="empty">이 날은 경기가 없습니다.</div>`;

  $("#scorers").innerHTML = scorerHtml();

  const done = all.filter(m => scores[m.id]).length;
  const goals = all.reduce((s,m) => s + ((logs[m.id]?.goals || []).length), 0);
  $("#foot").innerHTML =
    `<div class="pill">완료<b>${done} / ${all.length}</b></div>
     <div class="pill">총 득점<b>${goals}</b></div>
     <div class="pill">구장<b>${courts.length}면</b></div>`;
}

function card(c, ms, today, n){
  ms = ms.slice().sort((a,b) => span(a.time)[0] - span(b.time)[0]);

  let cur = null, state = "", next = null;
  if(today){
    cur = ms.find(m => { const [s,e] = span(m.time); return n >= s && n <= e; });
    if(cur) state = "live";
    if(!cur){
      next = ms.find(m => span(m.time)[0] > n);
      const past = ms.filter(m => span(m.time)[1] < n);
      cur = past.length ? past[past.length - 1] : (next || ms[0]);
      state = past.length ? "done" : "soon";
    }
  }else{
    cur = ms.find(m => !scores[m.id]) || ms[ms.length - 1];
    state = scores[cur?.id] ? "done" : "soon";
  }
  if(!cur) return "";

  const sv = scores[cur.id] || [0,0];
  const L = logs[cur.id] || {};
  const TN = { 1:cur.t1, 2:cur.t2 };
  const gl = (L.goals || []).map(g =>
    `<span><b>${esc(g.name || "?")}</b> ${esc(TN[g.t] || "")}${g.min?" "+esc(g.min)+"′":""}</span>`).join("");

  const label = { live:"● 진행 중", done:"종료", soon:"경기 전" }[state];
  const rp = (state === "done") ? replayUrl(cur) : "";
  if(!next) next = ms.find(m => span(m.time)[0] > nowMin());

  return `<section class="ct ${state==='live'?'on':''} ${state==='done'?'done':''}">
    <div class="cth"><em>${COURT[c]}</em><span class="nm">${COURT[c]}구장</span>
      <span class="st">${label}</span></div>
    <div class="body">
      <div class="tm">${esc(cur.time)} · ${esc(cur.div)} ${esc(cur.rd || "")}</div>
      <div class="row">
        <span class="tname">${esc(cur.t1)}</span>
        <span class="sc">${sv[0]}</span><span class="sep">:</span><span class="sc">${sv[1]}</span>
        <span class="tname">${esc(cur.t2)}</span>
      </div>
      ${gl ? `<div class="gl">${gl}</div>` : ""}
    </div>
    ${rp ? `<a class="rp" href="${rp}" target="_blank" rel="noopener">▶ 이 경기 다시보기</a>` : ""}
    ${next && next.id !== cur.id
      ? `<div class="next">다음 <b>${esc(next.time.split("~")[0])}</b> ${esc(next.t1)} vs ${esc(next.t2)}</div>`
      : ""}
  </section>`;
}

date = pickDate();
dates(); tick(); load();
setInterval(tick, 1000);
setInterval(() => { if(!pinned || date === todayStr()) load(); }, 12000);
</script>
</html>
