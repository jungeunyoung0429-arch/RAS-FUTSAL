<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실시간 현황 · 2026 RAS 풋살</title>
<style>
:root{
  --bg:#07251B; --card:#0E3B2E; --card2:#0A3125; --line:#1C5742;
  --ink:#F2FBF6; --mute:#8FBBA6; --grn:#0BC463; --lamp:#FFC53D; --live:#FF4D4D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.4;padding-bottom:28px;overflow-x:hidden}

header{padding:14px 16px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:17px;font-weight:900;letter-spacing:-.02em}
h1 span{display:block;font-size:10.5px;font-weight:800;color:var(--grn);letter-spacing:.1em;margin-bottom:3px}
.clock{margin-left:auto;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{width:100%;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--mute)}
.sub .dot{width:7px;height:7px;border-radius:50%;background:var(--grn);animation:bl 1.6s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}

.dates{display:flex;gap:6px;overflow-x:auto;padding:11px 16px 0;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 auto;padding:7px 13px;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--mute);font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.dates button.on{background:var(--grn);border-color:var(--grn);color:#06301F}

.grid{display:grid;grid-template-columns:1fr;gap:11px;padding:13px 16px 0;max-width:1500px;margin:0 auto}
@media(min-width:720px){ .grid{grid-template-columns:1fr 1fr;gap:14px;padding:16px} }
@media(min-width:1180px){ .grid{gap:18px} h1{font-size:21px} .clock{font-size:34px} }

.ct{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column}
.ct.on{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.cth{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--card2);
  border-bottom:1px solid var(--line)}
.cth em{font-style:normal;width:26px;height:26px;border-radius:7px;background:var(--grn);color:#06301F;
  display:grid;place-items:center;font-size:15px;font-weight:900;flex:0 0 auto}
.cth .nm{font-size:13.5px;font-weight:800}
.cth .st{margin-left:auto;font-size:10.5px;font-weight:900;padding:3px 9px;border-radius:20px;
  background:#174433;color:var(--mute);letter-spacing:.02em;white-space:nowrap}
.ct.on .cth em{background:var(--live);color:#fff}
.ct.on .cth .st{background:var(--live);color:#fff}
.ct.done .cth .st{background:#1F6B4C;color:#B8E8CE}

.body{padding:16px 13px;flex:1;display:flex;flex-direction:column;justify-content:center}
.tm{font-size:11.5px;font-weight:800;color:var(--mute);text-align:center;margin-bottom:11px;
  letter-spacing:.02em}
.row{display:flex;align-items:center;gap:8px}
.tname{flex:1;font-size:17px;font-weight:800;text-align:center;letter-spacing:-.03em;
  word-break:keep-all;line-height:1.25}
.sc{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;min-width:50px;text-align:center;
  line-height:1;letter-spacing:-.04em}
.sep{font-size:24px;font-weight:900;color:var(--line)}
.ct.on .sc{color:var(--lamp)}
@media(min-width:1180px){ .sc{font-size:62px;min-width:72px} .tname{font-size:22px} }

.gl{margin-top:13px;border-top:1px solid var(--line);padding-top:10px;
  display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.gl span{font-size:11px;font-weight:700;color:var(--mute);background:#0A3125;
  padding:3px 8px;border-radius:14px;white-space:nowrap}
.gl span b{color:var(--ink);font-weight:800}
.empty{text-align:center;color:var(--mute);font-size:13px;font-weight:700;padding:22px 0}

.next{padding:9px 13px;border-top:1px solid var(--line);background:var(--card2);
  font-size:11.5px;font-weight:700;color:var(--mute);text-align:center}
.next b{color:var(--ink);font-weight:800}

.foot{max-width:1500px;margin:16px auto 0;padding:0 16px;display:flex;gap:9px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 14px;
  font-size:12.5px;font-weight:800;color:var(--mute)}
.pill b{color:var(--ink);font-size:15px;margin-left:5px}
.err{margin:14px 16px 0;padding:11px 14px;border-radius:11px;background:#5A1A1A;
  font-size:12.5px;font-weight:700;color:#FFD9D9;display:none}
.err.on{display:block}
</style>

<header>

 "M166"}, {"div": "중등남", "date": "11/21", "dow": "토", "slot": 19, "court": 2, "time": "15:10~15:25", "grp": "리그", "rd": "10R", "t1": "이호중", "t2": "선부중", "id": "M167"}, {"div": "중등여", "date": "11/21", "dow": "토", "slot": 19, "court": 3, "time": "15:10~15:25", "grp": "리그", "rd": "12R", "t1": "해솔중", "t2": "원곡중", "id": "M168"}, {"div": "중등남", "date": "11/21", "dow": "토", "slot": 20, "court": 1, "time": "15:30~15:45", "grp": "리그", "rd": "10R", "t1": "선일중", "t2": "관산중", "id": "M169"}, {"div": "중등남", "date": "11/21", "dow": "토", "slot": 20, "court": 2, "time": "15:30~15:45", "grp": "리그", "rd": "10R", "t1": "원일중", "t2": "성호중", "id": "M170"}, {"div": "중등여", "date": "11/21", "dow": "토", "slot": 20, "court": 3, "time": "15:30~15:45", "grp": "리그", "rd": "13R", "t1": "본오중", "t2": "이호중", "id": "M171"}, {"div": "중등여", "date": "11/21", "dow": "토", "slot": 20, "court": 4, "time": "15:30~15:45", "grp": "리그", "rd": "13R", "t1": "부곡중", "t2": "별망중", "id": "M172"}, {"div": "중등남", "date": "11/21", "dow": "토", "slot": 21, "court": 1, "time": "15:50~16:05", "grp": "리그", "rd": "10R", "t1": "중앙중", "t2": "원곡중", "id": "M173"}, {"div": "중등남", "date": "11/21", "dow": "토", "slot": 21, "court": 2, "time": "15:50~16:05", "grp": "리그", "rd": "11R", "t1": "해솔중", "t2": "부곡중", "id": "M174"}, {"div": "중등여", "date": "11/21", "dow": "토", "slot": 21, "court": 3, "time": "15:50~16:05", "grp": "리그", "rd": "13R", "t1": "선일중", "t2": "해솔중", "id": "M175"}, {"div": "중등남", "date": "11/21", "dow": "토", "slot": 22, "court": 1, "time": "16:10~16:25", "grp": "리그", "rd": "11R", "t1": "선부중", "t2": "선일중", "id": "M176"}, {"div": "중등남", "date": "11/21", "dow": "토", "slot": 22, "court": 2, "time": "16:10~16:25", "grp": "리그", "rd": "11R", "t1": "관산중", "t2": "원일중", "id": "M177"}, {"div": "중등여", "date": "11/21", "dow": "토", "slot": 22, "court": 3, "time": "16:10~16:25", "grp": "리그", "rd": "14R", "t1": "별망중", "t2": "본오중", "id": "M178"}, {"div": "중등여", "date": "11/21", "dow": "토", "slot": 22, "court": 4, "time": "16:10~16:25", "grp": "리그", "rd": "14R", "t1": "부곡중", "t2": "원곡중", "id": "M179"}, {"div": "중등남", "date": "11/21", "dow": "토", "slot": 23, "court": 1, "time": "16:30~16:45", "grp": "리그", "rd": "11R", "t1": "성호중", "t2": "중앙중", "id": "M180"}, {"div": "중등남", "date": "11/21", "dow": "토", "slot": 23, "court": 2, "time": "16:30~16:45", "grp": "리그", "rd": "11R", "t1": "본오중", "t2": "원곡중", "id": "M181"}, {"div": "중등여", "date": "11/21", "dow": "토", "slot": 23, "court": 3, "time": "16:30~16:45", "grp": "리그", "rd": "14R", "t1": "이호중", "t2": "선일중", "id": "M182"}], "groups": {"중등남": {"리그": ["선부중", "선일중", "이호중", "관산중", "해솔중", "성호중", "본오중", "원곡중", "중앙중", "부곡중", "원일중"]}, "중등여": {"리그": ["선일중", "이호중", "해솔중", "본오중", "원곡중", "부곡중", "별망중"]}, "고등여": {"리그": ["동산고", "원곡고", "양지고", "선부고", "초지고", "국비고"]}, "고등남": {"리그": ["동산고", "원곡고", "고잔고", "단원고", "성안고", "양지고", "광덕고", "초지고", "신길고", "송호고", "안산공고"]}}};
/* ═════════════ */

const COURT = ["", "A", "B", "C", "D"];
const YEAR = 2026;
let scores = {}, logs = {}, date = "", pinned = false, failed = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dnum = d => { const [m, x] = d.split("/").map(Number); return m * 100 + x; };

const DATES = [...new Set(DATA.matches.map(m => m.date))].sort((a,b) => dnum(a) - dnum(b));
const DOW = {}; DATA.matches.forEach(m => DOW[m.date] = m.dow);

/* "17:30~17:45" → 분 단위 [시작, 끝] */
function span(t){
  const [a, b] = t.split("~");
  const mm = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  return [mm(a), mm(b)];
}
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const todayStr = () => { const d = new Date(); return (d.getMonth()+1) + "/" + d.getDate(); };

/* 오늘이 경기일이면 오늘, 아니면 다음 경기일 */
function pickDate(){
  const t = todayStr();
  if(DATES.includes(t)) return t;
  const n = dnum(t);
  return DATES.find(d => dnum(d) >= n) || DATES[DATES.length - 1];
}

async function load(){
  try{
    const r = await fetch("/api/data", { cache: "no-store" });
    if(!r.ok) throw 0;
    const d = await r.json();
    scores = d.scores || {}; logs = d.logs || {};
    failed = 0; $("#err").classList.remove("on");
  }catch(e){
    failed++;
    if(failed > 1) $("#err").classList.add("on");
  }
  render();
}

function tick(){
  const d = new Date();
  $("#clk").textContent =
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function dates(){
  $("#dates").innerHTML = DATES.map(d =>
    `<button data-d="${d}" class="${d===date?'on':''}">${d}(${DOW[d]})</button>`).join("");
  $("#dates").querySelectorAll("button").forEach(b =>
    b.onclick = () => { date = b.dataset.d; pinned = true; dates(); render(); });
}

function render(){
  const today = (date === todayStr());
  const n = nowMin();
  const all = DATA.matches.filter(m => m.date === date);
  const courts = [...new Set(all.map(m => m.court))].sort();

  $("#sub").textContent =
    `${date}(${DOW[date]||""}) · ${all.length}경기` +
    (today ? " · 12초마다 자동 갱신" : " · 오늘이 아닙니다");

  $("#grid").innerHTML = courts.length
    ? courts.map(c => card(c, all.filter(m => m.court === c), today, n)).join("")
    : `<div class="empty">이 날은 경기가 없습니다.</div>`;

  const done = all.filter(m => scores[m.id]).length;
  const goals = all.reduce((s,m) => s + ((logs[m.id]?.goals || []).length), 0);
  $("#foot").innerHTML =
    `<div class="pill">완료<b>${done} / ${all.length}</b></div>
     <div class="pill">총 득점<b>${goals}</b></div>
     <div class="pill">구장<b>${courts.length}면</b></div>`;
}

function card(c, ms, today, n){
  ms = ms.slice().sort((a,b) => span(a.time)[0] - span(b.time)[0]);

  let cur = null, state = "", next = null;
  if(today){
    cur = ms.find(m => { const [s,e] = span(m.time); return n >= s && n <= e; });
    if(cur) state = "live";
    if(!cur){
      next = ms.find(m => span(m.time)[0] > n);
      const past = ms.filter(m => span(m.time)[1] < n);
      cur = past.length ? past[past.length - 1] : (next || ms[0]);
      state = past.length ? "done" : "soon";
    }
  }else{
    cur = ms.find(m => !scores[m.id]) || ms[ms.length - 1];
    state = scores[cur?.id] ? "done" : "soon";
  }
  if(!cur) return "";

  const sv = scores[cur.id] || [0,0];
  const L = logs[cur.id] || {};
  const TN = { 1:cur.t1, 2:cur.t2 };
  const gl = (L.goals || []).map(g =>
    `<span><b>${esc(g.name || "?")}</b> ${esc(TN[g.t] || "")}${g.min?" "+esc(g.min)+"′":""}</span>`).join("");

  const label = { live:"● 진행 중", done:"종료", soon:"경기 전" }[state];
  if(!next) next = ms.find(m => span(m.time)[0] > nowMin());

  return `<section class="ct ${state==='live'?'on':''} ${state==='done'?'done':''}">
    <div class="cth"><em>${COURT[c]}</em><span class="nm">${COURT[c]}구장</span>
      <span class="st">${label}</span></div>
    <div class="body">
      <div class="tm">${esc(cur.time)} · ${esc(cur.div)} ${esc(cur.rd || "")}</div>
      <div class="row">
        <span class="tname">${esc(cur.t1)}</span>
        <span class="sc">${sv[0]}</span><span class="sep">:</span><span class="sc">${sv[1]}</span>
        <span class="tname">${esc(cur.t2)}</span>
      </div>
      ${gl ? `<div class="gl">${gl}</div>` : ""}
    </div>
    ${next && next.id !== cur.id
      ? `<div class="next">다음 <b>${esc(next.time.split("~")[0])}</b> ${esc(next.t1)} vs ${esc(next.t2)}</div>`
      : ""}
  </section>`;
}

date = pickDate();
dates(); tick(); load();
setInterval(tick, 1000);
setInterval(() => { if(!pinned || date === todayStr()) load(); }, 12000);
</script>
