<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경기 기록 · 2026 RAS 풋살</title>
<style>
:root{
  --ink:#1A1508; --bg:#FFF9EC; --card:#fff; --line:#E7DCC2; --lamp:#F5B70A; --lampd:#7A5C00;
  --turf:#0E3B2E; --mute:#8A7C5C; --red:#C0392B; --blue:#1F6FB2; --grn:#0B7A45; --vio:#6B4FC9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:40px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
button{font:inherit;cursor:pointer}

header{background:var(--lamp);padding:13px 14px 14px}
header .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
h1{margin:0;font-size:19px;font-weight:800;color:var(--lampd);letter-spacing:-.02em}
h1 span{display:block;font-size:11.5px;font-weight:700;color:#8B6B0C;margin-bottom:3px}
header .who{font-size:11.5px;font-weight:800;color:#8B6B0C;white-space:nowrap}

.tabs{display:flex;gap:5px;background:var(--lamp);padding:0 14px 11px}
.tabs .in{max-width:640px;margin:0 auto;display:flex;gap:5px;width:100%}
.tabs button{flex:1;padding:9px 0;border:0;border-radius:10px;background:rgba(255,255,255,.45);
  color:var(--lampd);font-size:13.5px;font-weight:800}
.tabs button.on{background:#fff;color:var(--turf)}

/* 코드 입력 */
.gate{max-width:340px;margin:56px auto;padding:0 20px;text-align:center}
.gate h2{font-size:19px;font-weight:800;margin:0 0 6px}
.gate p{font-size:13px;color:var(--mute);margin:0 0 18px;font-weight:600}
.gate input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;
  font:inherit;font-size:19px;font-weight:800;text-align:center;letter-spacing:.2em;outline:0}
.gate input:focus{border-color:var(--lamp)}
.gate button{width:100%;margin-top:9px;padding:14px;border:0;border-radius:12px;
  background:var(--turf);color:#fff;font-size:15px;font-weight:800}

/* 선택 바 */
.pick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:13px 0 3px}
.pick::-webkit-scrollbar{display:none}
.pick button{flex:0 0 auto;padding:8px 13px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;font-size:13px;font-weight:800;color:var(--mute)}
.pick button.on{background:var(--turf);border-color:var(--turf);color:#fff}

.bar{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
.bar h3{margin:0;font-size:14px;font-weight:800}
.bar .cnt{font-size:12px;font-weight:800;color:var(--mute);margin-left:auto}

/* 경기 카드 */
.m{background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.m.done{border-color:#BFD9C8}
.mh{display:flex;align-items:center;gap:9px;padding:11px 13px;background:#FFFCF4;border-bottom:1px solid #F2EADA}
.m.done .mh{background:#F1F8F3}
.mh .no{font-size:11px;font-weight:800;color:#fff;background:var(--mute);padding:3px 7px;border-radius:6px}
.m.done .mh .no{background:var(--grn)}
.mh .tm{font-size:11.5px;font-weight:700;color:var(--mute)}
.mh .st{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--mute)}
.m.done .mh .st{color:var(--grn)}

.sc{display:flex;align-items:center;padding:13px;gap:8px}
.sc .tn{flex:1;font-size:15px;font-weight:800;text-align:center;letter-spacing:-.02em;word-break:keep-all}
.sc .nm{font-size:30px;font-weight:900;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.sc .dash{color:var(--line);font-weight:800}

.open{border-top:1px solid #F2EADA;padding:13px;display:none;background:#FFFDF8}
.m.o .open{display:block}
.m .toggle{width:100%;padding:11px;border:0;border-top:1px solid #F2EADA;background:#FFFCF4;
  font-size:13px;font-weight:800;color:var(--turf)}

/* 섹션 */
.sec{margin-bottom:15px}
.sec>h4{margin:0 0 7px;font-size:12.5px;font-weight:800;color:var(--turf);display:flex;align-items:center;gap:6px}
.sec>h4 b{font-size:10.5px;font-weight:800;color:#fff;padding:2px 6px;border-radius:5px;background:var(--mute)}
.sec>h4 i{font-style:normal;font-size:11px;font-weight:600;color:var(--mute);margin-left:auto}

.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.gbtn{padding:11px 4px;border:1.5px solid var(--grn);border-radius:11px;background:#fff;
  color:var(--grn);font-size:13px;font-weight:800;line-height:1.3}
.gbtn b{display:block;font-size:11px;font-weight:700;color:var(--mute);margin-bottom:2px}
.gbtn.amber{border-color:#E0A008;color:#A8750A}
.pickbar{background:#FFF8E8;border:1.5px solid #F0D28A;border-radius:12px;padding:10px}
.pickbar .pt{font-size:12.5px;font-weight:800;color:#8A6520;margin-bottom:8px;text-align:center}
.seg3{display:flex;gap:6px}
.seg3 button{flex:1;padding:11px 0;border:0;border-radius:10px;font-size:14px;font-weight:800;color:#fff}
.seg3 .k-y{background:#E0A008}
.seg3 .k-r{background:var(--red)}
.seg3 .k-c{background:#fff;color:var(--mute);border:1.5px solid var(--line)}
.seg3 .k-new{background:#fff;color:#8A6520;border:1.5px solid #E6C77E}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{flex:1 1 calc(50% - 6px);min-width:calc(50% - 6px);padding:13px 8px;border-radius:10px;
  border:1.5px solid #E6C77E;background:#fff;color:#4A3A12;font-size:14px;font-weight:800;
  text-align:center;line-height:1.3;white-space:normal;word-break:break-word}
.chips .chip:active{background:#FBEFD2}
.nochip{font-size:12.5px;color:#8A6520;text-align:center;padding:12px 4px;line-height:1.5}

.list{margin-top:7px;display:flex;flex-direction:column;gap:5px}
.it{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;font-size:13px}
.it .tg{font-size:10.5px;font-weight:800;color:#fff;padding:2px 6px;border-radius:5px;flex:0 0 auto}
.it .tg.a{background:var(--grn)} .it .tg.b{background:var(--blue)}
.it .tg.y{background:#E0A008} .it .tg.r{background:var(--red)}
.it span{font-weight:700}
.it em{font-style:normal;color:var(--mute);font-size:11.5px;font-weight:600}
.it .x{margin-left:auto;border:0;background:#F3EEE2;color:var(--mute);width:23px;height:23px;
  border-radius:50%;font-size:13px;line-height:1;flex:0 0 auto}

.cnt2{display:flex;align-items:center;gap:7px}
.cnt2 .lb{font-size:13px;font-weight:800;flex:1;word-break:keep-all}
.cnt2 button{width:33px;height:33px;border:1.5px solid var(--line);border-radius:9px;background:#fff;
  font-size:17px;font-weight:800;color:var(--turf);line-height:1}
.cnt2 .v{min-width:26px;text-align:center;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.row2{display:flex;flex-direction:column;gap:7px}

.seg{display:flex;gap:4px}
.seg button{flex:1;padding:8px 2px;border:1.5px solid var(--line);border-radius:9px;background:#fff;
  font-size:11.5px;font-weight:800;color:var(--mute);line-height:1.25}
.seg button.on{background:var(--turf);border-color:var(--turf);color:#fff}
.seg button.on.w{background:#E0A008;border-color:#E0A008}
.seg button.on.bad{background:var(--red);border-color:var(--red)}
.fp{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:7px}
.fp .tt{font-size:12.5px;font-weight:800;margin-bottom:7px}

input[type=text],textarea,select{width:100%;padding:9px 11px;border:1.5px solid var(--line);
  border-radius:9px;background:#fff;font:inherit;font-size:14px;color:var(--ink);outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--lamp)}
textarea{resize:vertical;min-height:56px}
label.f{display:block;font-size:11.5px;font-weight:800;color:var(--mute);margin:0 0 4px}

.save{width:100%;padding:14px;border:0;border-radius:12px;background:var(--turf);color:#fff;
  font-size:15px;font-weight:800;margin-top:4px}
.del{width:100%;padding:10px;border:0;border-radius:11px;background:#F6EFE2;color:var(--red);
  font-size:12.5px;font-weight:800;margin-top:7px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(90px);
  background:var(--turf);color:#fff;padding:12px 20px;border-radius:30px;font-size:13.5px;font-weight:800;
  box-shadow:0 6px 22px rgba(0,0,0,.22);transition:transform .22s;z-index:99;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--mute);font-size:13px;font-weight:700;padding:34px 0}

/* 출전일 평가 */
.dayc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.dayc h4{margin:0 0 9px;font-size:15px;font-weight:800}
.dayc .done{font-size:11px;font-weight:800;color:var(--grn);margin-left:7px}
.rule{background:#EAF3FB;border:1.5px solid #B9D6EE;border-radius:11px;padding:10px 12px;margin-bottom:14px}
.rule b{display:block;font-size:11.5px;font-weight:800;color:#1F6FB2;margin-bottom:5px}
.rule span{display:block;font-size:11.5px;font-weight:600;color:#3A5A72;line-height:1.65}
.rule em{font-style:normal;font-weight:800;color:#15405E}
.livec{background:#FFF6E0;border:1.5px solid #F0D28A;border-radius:14px;padding:13px;margin-bottom:12px}
.livec h4{margin:0 0 5px;font-size:14px;font-weight:800;color:#8A6520;display:flex;align-items:center;gap:7px}
.livec h4 i{font-style:normal;font-size:11.5px;font-weight:700;color:#A8875A;margin-left:auto}
.lhint{margin:0 0 10px;font-size:11.5px;font-weight:600;color:#8A6520;line-height:1.5}
.lhint b{color:#5E4410}
.lrow{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.llab{flex:0 0 38px;font-size:12px;font-weight:800;color:#8A6520;text-align:center}
.lrow input{flex:1;min-width:0;padding:9px 10px;border:1.5px solid #E6CF9C;border-radius:9px;
  background:#fff;font:inherit;font-size:13.5px;color:var(--ink);outline:0}
.lrow input.lt{flex:0 0 78px;text-align:center;font-weight:800}
.lrow input:focus{border-color:var(--lamp)}
.livec .lsave{background:#8A6520;margin-top:3px}
.sumnote{font-size:12px;color:var(--mute);font-weight:600;margin:14px 0 2px;line-height:1.65}
.sumnote b{color:var(--ink)}
.sumsec{background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  margin:12px 0;overflow:hidden}
.sumsec h3{margin:0;padding:10px 13px;background:var(--turf);color:#fff;
  font-size:14px;font-weight:800;display:flex;align-items:center}
.sumsec h3 span{margin-left:auto;font-size:11px;font-weight:700;color:#9FCBB4}
table.sumt{width:100%;border-collapse:collapse;table-layout:fixed}
table.sumt th{background:#FFFCF4;font-size:10.5px;font-weight:800;color:var(--mute);
  padding:7px 1px;border-bottom:1.5px solid var(--line);text-align:center}
table.sumt td{padding:9px 1px;text-align:center;border-bottom:1px solid #F2EADA;
  font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
table.sumt .l{width:74px;text-align:left;padding-left:11px;font-weight:800;
  font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.sumt .r{width:48px;padding-right:10px}
table.sumt td.l b{color:var(--lamp);margin-right:2px}
table.sumt td.tt{font-weight:900;font-size:14px;color:var(--turf)}
table.sumt tr.top{background:#F6FBF7}
table.sumt tbody tr:last-child td{border-bottom:0}
.srow{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;background:#FFFDF8}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sh b{font-size:11.5px;font-weight:800;color:#fff;padding:3px 8px;border-radius:6px}
.sh i{font-style:normal;font-size:11px;font-weight:700;color:var(--mute);margin-left:auto}
.sd{margin:0 0 9px;font-size:11.5px;color:var(--mute);font-weight:600;line-height:1.45}
.snum{display:flex;align-items:center;gap:7px}
.snum .sb{width:38px;height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
  font-size:19px;font-weight:800;color:var(--turf);line-height:1;flex:0 0 auto}
.snum input{flex:1;min-width:0;padding:9px 6px;border:2px solid var(--line);border-radius:10px;
  background:#fff;font:inherit;font-size:21px;font-weight:900;text-align:center;color:var(--ink);outline:0;
  -moz-appearance:textfield}
.snum input::-webkit-outer-spin-button,.snum input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.snum input:focus{border-color:var(--lamp)}
.snum .su{font-size:12.5px;font-weight:800;color:var(--mute);flex:0 0 auto}
.quick{display:flex;gap:5px;margin-top:7px}
.quick button{flex:1;padding:7px 0;border:1.5px solid var(--line);border-radius:8px;background:#fff;
  font-size:12.5px;font-weight:800;color:var(--mute)}
.quick button.on{background:var(--turf);border-color:var(--turf);color:#fff}
</style>

<div id="app"></div>
<div class="toast" id="toast"></div>

/* ───── 선수 명단 ─────
   한 번 입력된 이름은 자동으로 명단에 쌓입니다.
   아래 SEED 는 첫 입력을 돕는 최초 명단일 뿐이며, 직접 손대지 않아도 됩니다. */
const SEED = {
  "원곡중": ["6 이준", "7 이담", "10 진승연", "17 윤하율"],
  "본오중": ["5 MUCO CHRIST RABY", "6 김지현", "7 전유담", "8 정민준"],
  "중앙중": ["8 공선우", "21 이윤기", "99 문주원"],

};

/* 등번호 우선 정렬 */
const PRE = /^\s*(\d+)\s*번?\s*[.·,]?\s*/;
const pNo   = s => { const m = String(s||"").match(PRE); return m ? m[1] : null; };
const pRest = s => String(s||"").replace(PRE, "").replace(/^번\s*/, "").trim();
const pnum  = s => { const n = pNo(s); return n ? +n : 9999; };

/* 팀의 선수 명단 — 등번호가 같으면 한 명으로 묶고, 알고 있는 이름을 붙입니다 */
function roster(team){
  const bk = {};                      // 등번호 → 이름
  const free = new Map();             // 번호 없는 이름
  const add = raw => {
    const v = String(raw || "").trim(); if(!v) return;
    const no = pNo(v), nm = pRest(v);
    if(!no){ free.set(v, true); return; }
    if(nm && !bk[no]) bk[no] = nm;
    else if(!(no in bk)) bk[no] = "";
  };
  (SEED[team] || []).forEach(add);
  DATA.matches.forEach(m => {
    const side = m.t1 === team ? 1 : (m.t2 === team ? 2 : 0); if(!side) return;
    const src = [logs[m.id], draft[m.id]].filter(Boolean);
    src.forEach(L => {
      (L.goals || []).forEach(g => { if(g.t === side) add(g.name); });
      (L.cards || []).forEach(c => { if(c.t === side) add(c.name); });
    });
  });
  const out = Object.keys(bk).map(no => bk[no] ? `${no} ${bk[no]}` : `${no}번`);
  return out.concat([...free.keys()])
    .sort((a,b) => pnum(a) - pnum(b) || a.localeCompare(b,"ko"));
}

  const r = await fetch(API + "?t=" + encodeURIComponent(tok), { cache: "no-store" });
  const d = await r.json();
  scores = d.scores || {}; logs = d.logs || {}; days = d.days || {};
  auth = d.auth || { ok: false };
  return auth.ok;
}

async function put(body){
  try{
    const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ ...body, token: tok }) });

}

/* ───────── 유튜브 중계 설정 ─────────
   days["11/14|_live"] 에 저장합니다. (별도 서버 수정 없이 기존 저장소를 씁니다)
   값: { v1:오전 영상ID, t1:오전 중계 시작시각, v2:오후 영상ID, t2:오후 중계 시작시각 }
   ───────────────────────────────── */
const liveKey = d => d + "|_live";

/* 어떤 형태의 유튜브 주소를 넣어도 영상 ID만 뽑아냅니다 */
function ytId(s){
  s = String(s || "").trim();
  if(!s) return "";
  const m = s.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{6,})/);
  if(m) return m[1];
  return /^[A-Za-z0-9_-]{6,}$/.test(s) ? s : "";
}

function liveCard(){
  const v = days[liveKey(date)] || {};
  const two = ["11/14", "11/21"].includes(date);
  const row = (n, lab) => `
    <div class="lrow">
      <div class="llab">${lab}</div>
      <input type="text" data-lv="v${n}" placeholder="유튜브 주소 또는 영상 ID" value="${esc(v["v"+n] || "")}">
      <input type="text" data-lv="t${n}" class="lt" inputmode="numeric" placeholder="예 08:25"
             value="${esc(v["t"+n] || "")}">
    </div>`;
  return `<section class="livec">
    <h4>📺 유튜브 중계 설정 <i>${date}</i></h4>
    <p class="lhint">중계 주소와 <b>중계를 시작한 시각</b>을 넣으면, 관람 화면에 중계가 뜨고
       경기마다 <b>다시보기</b> 링크가 자동으로 만들어집니다.</p>

    <button class="save lsave">중계 정보 저장</button>
  </section>`;
}

function bindLive(){
  const el = $(".livec"); if(!el) return;
  el.querySelector(".lsave").onclick = async e => {
    const val = { ...(days[liveKey(date)] || {}) };
    el.querySelectorAll("[data-lv]").forEach(i => {
      const k = i.dataset.lv, raw = i.value.trim();
      if(k[0] === "v") val[k] = ytId(raw);
      else val[k] = raw;
      if(!val[k]) delete val[k];
    });
    const bad = el.querySelector('[data-lv="v1"]').value.trim() && !val.v1;
    if(bad) return toast("유튜브 주소를 알아볼 수 없습니다. 주소를 그대로 붙여넣어 주세요");
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = "저장 중…";
    const ok = await put({ type:"day", id:liveKey(date), value:val });
    btn.disabled = false; btn.textContent = "중계 정보 저장";
    if(ok){ days[liveKey(date)] = { ...val, at:new Date().toISOString() };
            toast("중계 정보를 저장했습니다"); render(); }
    else toast("저장 실패 · 다시 눌러 주세요");
  };
}

function D(m){
  if(draft[m.id]) return draft[m.id];
  const L = logs[m.id] || {};
  draft[m.id] = {
    goals: (L.goals || []).map(g => ({ ...g })),
    cards: (L.cards || []).map(c => ({ ...c })),
    fouls: (L.fouls || [0,0]).slice(),
    fair: { 1:{ argue:(L.fair&&L.fair[1]&&L.fair[1].argue)??2, own:(L.fair&&L.fair[1]&&L.fair[1].own)||0 },
            2:{ argue:(L.fair&&L.fair[2]&&L.fair[2].argue)??2, own:(L.fair&&L.fair[2]&&L.fair[2].own)||0 } },
    mvp:  { team:(L.mvp&&L.mvp.team)||"", name:(L.mvp&&L.mvp.name)||"" },
    note: L.note || ""
  };
  return draft[m.id];
}
const tally = d => [1,2].map(t => d.goals.filter(g => g.t === t).length);

function card(m){
  const d = D(m), sc = scores[m.id], live = tally(d);
  const sv = sc ? sc : live;
  const op = !!open[m.id];
  return `<section class="m ${sc?'done':''} ${op?'o':''}" data-id="${m.id}">
    <div class="mh">
      <span class="no">${m.slot}경기</span>
      <span class="tm">${esc(m.time)} · ${esc(m.rd||'')}</span>
      <span class="st">${sc ? '기록 완료' : '미기록'}</span>
    </div>
    <div class="sc">
      <span class="tn">${esc(m.t1)}</span>
      <span class="nm">${sv[0]}</span><span class="dash">:</span><span class="nm">${sv[1]}</span>
      <span class="tn">${esc(m.t2)}</span>
    </div>
    <button class="toggle">${op ? '접기' : (sc ? '기록 보기 · 수정' : '기록 입력하기')}</button>
    <div class="open">${op ? form(m, d) : ''}</div>
  </section>`;
}

function namePanel(m, t, title, kind){

  const list = roster(team);

function bind(m){
  const el = $(`[data-id="${m.id}"]`); if(!el) return;
  const d = D(m), TN = { 1:m.t1, 2:m.t2 };
  const redraw = () => { render(); };

  el.querySelector(".toggle").onclick = () => { open[m.id] = !open[m.id]; render(); };
  if(!open[m.id]) return;

  const keep = () => {
    const mn = el.querySelector(`#mn_${m.id}`), nt = el.querySelector(`#nt_${m.id}`);
    if(mn) d.mvp.name = mn.value;
    if(nt) d.note = nt.value;
  };

  const askNew = team => {
    const v = prompt(`${team} — 명단에 없는 선수\n\n등번호와 이름을 함께 적어 주세요\n예)  7 전유담\n\n한 번 적어 두면 다음부터 목록에 나옵니다`, "");
    return v === null ? null : v.trim().replace(/\s+/g, " ");
  };

  /* 득점: 팀 선택 → 이름 슬롯 */
  el.querySelectorAll("[data-ga]").forEach(b => b.onclick = () => {
    keep(); pickGoal[m.id] = +b.dataset.ga; redraw();
  });
  const addGoal = name => {
    const t = pickGoal[m.id];
    delete pickGoal[m.id];
    if(!name) return redraw();                    // 취소
    d.goals.push({ t, name });
    redraw();
  };
  el.querySelectorAll("[data-gp]").forEach(b => b.onclick = () => { keep(); addGoal(b.dataset.gp); });
  el.querySelectorAll("[data-gpnew]").forEach(b => b.onclick = () => {
    keep();
    const v = askNew(TN[pickGoal[m.id]]);
    if(v === null) return redraw();
    addGoal(v);
  });

  /* 카드: 팀 선택 → 카드 종류 → 이름 슬롯 */
  el.querySelectorAll("[data-ca]").forEach(b => b.onclick = () => {
    keep(); pickCard[m.id] = { t:+b.dataset.ca, k:"" }; redraw();
  });
  el.querySelectorAll("[data-ck]").forEach(b => b.onclick = () => {
    keep();
    const k = b.dataset.ck;
    if(!k){ delete pickCard[m.id]; return redraw(); }   // 취소
    pickCard[m.id] = { t: pickCard[m.id].t, k };
    redraw();
  });
  const addCard = name => {
    const { t, k } = pickCard[m.id];
    delete pickCard[m.id];
    if(name) d.cards.push({ t, k, name });
    redraw();
  };
  el.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => { keep(); addCard(b.dataset.cp); });
  el.querySelectorAll("[data-cpnew]").forEach(b => b.onclick = () => {
    keep();
    const v = askNew(TN[pickCard[m.id].t]);
    if(v === null) return redraw();
    addCard(v);
  });

  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    keep();
    (b.dataset.rm === "g" ? d.goals : d.cards).splice(+b.dataset.i, 1);
    redraw();
  });

  el.querySelectorAll("[data-fl]").forEach(b => b.onclick = () => {
    const t = +b.dataset.fl;
    keep(); d.fouls[t-1] = Math.max(0, Math.min(99, d.fouls[t-1] + (+b.dataset.v))); redraw();
  });
  el.querySelectorAll("[data-fa]").forEach(b => b.onclick = () => {
    keep(); d.fair[+b.dataset.fa].argue = +b.dataset.v; redraw();
  });
  el.querySelectorAll("[data-fo]").forEach(b => b.onclick = () => {
    const t = +b.dataset.fo;
    keep(); d.fair[t].own = Math.max(0, Math.min(5, d.fair[t].own + (+b.dataset.v))); redraw();
  });
  el.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
    keep(); d.mvp.team = (d.mvp.team === b.dataset.mv) ? "" : b.dataset.mv; redraw();
  });

  el.querySelector(".save").onclick = async e => {
    keep();
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = "저장 중…";
    const sc = tally(d);
    const log = { goals:d.goals, cards:d.cards, fouls:d.fouls, fair:d.fair,
                  mvp:d.mvp, note:d.note.trim() };
    const ok = await put({ type:"match", id:m.id, score:sc, log });
    btn.disabled = false; btn.textContent = "저장하기";
    if(ok){
      scores[m.id] = sc; logs[m.id] = log; delete draft[m.id]; open[m.id] = false;
      toast(`${m.t1} ${sc[0]} : ${sc[1]} ${m.t2} 저장`);
      render();
    } else toast("저장 실패 · 다시 눌러 주세요");
  };

  const del = el.querySelector(".del");
  if(del) del.onclick = async () => {
    if(!confirm("이 경기 기록을 모두 지울까요?")) return;
    if(await put({ type:"match", id:m.id, score:null })){
      delete scores[m.id]; delete logs[m.id]; delete draft[m.id]; open[m.id] = false;
      toast("기록을 지웠습니다"); render();
    } else toast("실패 · 다시 눌러 주세요");
  };
}

function teamsOf(d){

}

const EVENTDAYS = ["11/14", "11/21"];
const dayItems = () => DAYITEMS.filter(([f]) => f !== "event" || EVENTDAYS.includes(date));

function scoreRow(f, title, desc, color, val){

function dayCard(team){
  const k = date + "|" + team;
  const saved = days[k] || {}, v = { ...saved, ...(dayD[k] || {}) };
  return `<div class="dayc" data-team="${esc(team)}">
    <h4>${esc(team)}${saved.at ? '<span class="done">✓ 입력됨</span>' : ''}</h4>

function bindDay(team){
  const el = $(`[data-team="${CSS.escape(team)}"]`); if(!el) return;
  const k = date + "|" + team;
  const cur = () => ({ ...(days[k] || {}), ...(dayD[k] || {}) });
  const clamp = n => Math.max(0, Math.min(20, n));
  const set = (f, v) => { dayD[k] = { ...cur(), [f]: v }; };
  const lit = (f, n) => el.querySelectorAll(`[data-sq="${f}"]`).forEach(
    b => b.classList.toggle("on", +b.dataset.v === n));

  /* 숫자 직접 입력 — 다시 그리면 커서가 사라지므로 화면은 건드리지 않습니다 */
  el.querySelectorAll("[data-sf]").forEach(inp => inp.oninput = () => {
    const f = inp.dataset.sf, raw = inp.value.trim();
    if(raw === ""){ const c = cur(); delete c[f]; dayD[k] = c; lit(f, -1); return; }
    const n = clamp(parseInt(raw, 10) || 0);
    if(String(n) !== raw) inp.value = n;
    set(f, n); lit(f, n);
  });

  el.querySelectorAll("[data-st]").forEach(b => b.onclick = () => {
    const f = b.dataset.st, inp = el.querySelector(`[data-sf="${f}"]`);
    const n = clamp((parseInt(inp.value, 10) || 0) + (+b.dataset.v));
    inp.value = n; set(f, n); lit(f, n);
  });

  el.querySelectorAll("[data-sq]").forEach(b => b.onclick = () => {
    const f = b.dataset.sq, n = +b.dataset.v;
    el.querySelector(`[data-sf="${f}"]`).value = n; set(f, n); lit(f, n);
  });

  el.querySelector(".dsave").onclick = async e => {
    const v = cur();
    const miss = dayItems().filter(([f, , , , req]) => req && v[f] === undefined);
    if(miss.length) return toast(miss.map(x => x[1]).join(" · ") + " 점수를 넣어 주세요");
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = "저장 중…";
    const value = {};
    dayItems().forEach(([f]) => { if(v[f] !== undefined) value[f] = v[f]; });
    const ok = await put({ type:"day", id:k, value });
    btn.disabled = false; btn.textContent = "저장하기";
    if(ok){
      days[k] = { ...value, at:new Date().toISOString() };
      delete dayD[k]; toast(team + " " + dayItems().reduce((n,[f]) => n + (value[f]||0), 0) + "점 저장"); render();
    } else toast("저장 실패 · 다시 눌러 주세요");
  };
}

/* ───────── 페어플레이 집계 ─────────
   뒷정리 · 호응 · 개폐회식 : 입력한 날들의 평균 (각 20점)
   판정 수용 : 경기 평균(0~2) × 10        (20점)
   자진 인정 : 인정 횟수 × 4, 최대 20점   (20점)
   ───────────────────────────────── */
const DIVS = ["중등남", "중등여", "고등남", "고등여"];
const DIVNAME = { 중등남:"중등부 남", 중등여:"중등부 여", 고등남:"고등부 남", 고등여:"고등부 여" };

function tally20(){
  const out = {};
  const put1 = (dv, t) => {
    const k = dv + "|" + t;
    if(!out[k]) out[k] = { div:dv, team:t, dates:new Set(),
      argueSum:0, argueN:0, own:0, goals:0, cards:0 };
    return out[k];
  };

  DATA.matches.forEach(m => {
    const L = logs[m.id];
    [[1, m.t1], [2, m.t2]].forEach(([n, t]) => {
      const r = put1(m.div, t);
      r.dates.add(m.date);
      if(!L) return;
      const f = L.fair && L.fair[n];
      if(f){
        if(f.argue !== undefined){ r.argueSum += f.argue; r.argueN++; }
        r.own += f.own || 0;
      }
      (L.goals || []).forEach(g => { if(g.t === n) r.goals++; });
      (L.cards || []).forEach(c => { if(c.t === n) r.cards++; });
    });
  });

  return Object.values(out).map(r => {
    const avg = f => {
      const v = [...r.dates].map(d => (days[d + "|" + r.team] || {})[f])
                            .filter(x => x !== undefined);
      return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null;
    };
    const clean = avg("clean"), cheer = avg("cheer"), event = avg("event");
    const argue = r.argueN ? (r.argueSum / r.argueN) * 10 : null;
    const own   = Math.min(20, r.own * 4);
    const parts = [clean, cheer, event, argue, own];
    const total = parts.reduce((a,b) => a + (b || 0), 0);
    const miss  = parts.filter(x => x === null).length;
    return { ...r, clean, cheer, event, argue, own, total, miss };
  });
}

const n1 = x => x === null ? "–" : (Math.round(x * 10) / 10);

function renderSum(){
  const rows = tally20();
  $("#body").innerHTML =
    `<p class="sumnote">입력된 기록으로 자동 계산합니다. 아직 안 넣은 항목은 <b>–</b> 로 표시되고 0점으로 칩니다.<br>
       뒷정리·호응·개폐회식은 <b>입력한 날들의 평균</b>, 판정 수용은 <b>경기 평균 × 10</b>,
       자진 인정은 <b>횟수 × 4</b>(최대 20)입니다.</p>` +
    DIVS.map(dv => {
      const list = rows.filter(r => r.div === dv)
                       .sort((a,b) => b.total - a.total || a.team.localeCompare(b.team,'ko'));
      if(!list.length) return "";
      return `<section class="sumsec">
        <h3>${DIVNAME[dv]}<span>${list.length}팀</span></h3>
        <table class="sumt">
          <thead><tr><th class="l">팀</th><th>뒷정리</th><th>호응</th><th>개폐</th><th>판정</th><th>자진</th><th class="r">합계</th></tr></thead>
          <tbody>${list.map((r,i) => `<tr class="${i===0?'top':''}">
            <td class="l">${i===0?'<b>★</b>':''}${esc(r.team)}</td>
            <td>${n1(r.clean)}</td><td>${n1(r.cheer)}</td><td>${n1(r.event)}</td>
            <td>${n1(r.argue)}</td><td>${r.own}</td>
            <td class="r tt">${Math.round(r.total*10)/10}</td></tr>`).join("")}</tbody>
        </table>
      </section>`;
    }).join("") +
    `<p class="sumnote">★ 는 현재 1위입니다. 우승·준우승팀은 수상 대상에서 제외하므로
       최종 수상팀은 본부에서 확인합니다.</p>`;
}

/* ───────── 시작 ───────── */
(async () => {
  if(tok && await load()) boot();
  else gate();
})();
</script>
