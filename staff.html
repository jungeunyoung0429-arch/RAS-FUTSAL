<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지원단 · 2026 RAS 풋살</title>
<style>
:root{--ink:#1A1508;--bg:#FFF9EC;--card:#fff;--line:#E7DCC2;--lamp:#F5B70A;--lampd:#7A5C00;
  --turf:#0E3B2E;--mute:#8A7C5C;--red:#C0392B;--blue:#1F6FB2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:40px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{background:var(--lamp);padding:13px 14px 14px}
header .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--lampd)}
h1 span{display:block;font-size:11.5px;font-weight:700;color:#8B6B0C;margin-bottom:3px}
.tabs{display:flex;gap:5px;background:var(--lamp);padding:0 14px 11px}
.tabs .in{max-width:640px;margin:0 auto;display:flex;gap:5px;width:100%}
.tabs button{flex:1;padding:9px 0;border:0;border-radius:10px;background:rgba(255,255,255,.45);
  color:var(--lampd);font:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
.tabs button.on{background:#fff;color:var(--turf)}
.gate{max-width:340px;margin:56px auto;padding:0 20px;text-align:center}
.gate h2{font-size:19px;font-weight:800;margin:0 0 6px}
.gate p{font-size:13px;color:var(--mute);margin:0 0 20px;line-height:1.6}
.gate input{width:100%;font:inherit;font-size:17px;font-weight:700;text-align:center;padding:13px;
  border:1.5px solid var(--line);border-radius:12px;background:#fff}
.gate button{width:100%;margin-top:9px;padding:14px;border:0;border-radius:12px;background:var(--turf);
  color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.err{color:var(--red);font-size:12.5px;font-weight:700;margin-top:9px;min-height:18px}
.ctrl{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ctrl .in{max-width:640px;margin:0 auto;padding:10px 14px}
.pick{display:flex;gap:5px;margin-bottom:8px}
.pick button{flex:1;padding:9px 0;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  font:inherit;font-size:13px;font-weight:800;color:var(--mute);cursor:pointer}
.pick button.on{background:var(--turf);border-color:var(--turf);color:#fff}
select,input[type=text],input[type=url],textarea{font:inherit;font-size:13.5px;padding:8px 10px;
  border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
.prog{margin-top:9px;font-size:12px;font-weight:700;color:var(--mute)}
.bar{height:5px;background:#EFE6CE;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--turf);border-radius:99px;transition:width .25s}
.slot{margin:16px 0 4px;font-size:13px;font-weight:800;color:var(--lampd);display:flex;
  align-items:baseline;gap:8px}
.slot span{font-weight:700;color:var(--mute);font-size:11.5px;font-variant-numeric:tabular-nums}
.g{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px}
.g.done{border-color:var(--turf);background:#F6FAF7}
.ghd{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:8px}
.ghd .cid{font-size:12px;font-weight:800;background:var(--turf);color:#fff;padding:3px 9px;border-radius:7px}
.ghd .dv{font-size:11.5px;color:var(--mute);font-weight:700;flex:1}
.ghd .st{font-size:11.5px;font-weight:800;color:var(--mute)}
.ghd .st.ok{color:var(--turf)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tm{text-align:center}
.tm .nm{font-size:14px;font-weight:800;margin-bottom:7px;word-break:keep-all;min-height:38px;
  display:flex;align-items:center;justify-content:center;line-height:1.25}
.stp{display:flex;align-items:center;gap:6px;justify-content:center}
.stp button{width:38px;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:11px;
  font-size:19px;font-weight:800;color:var(--turf);cursor:pointer;line-height:1;padding:0}
.stp button:active{background:#EFF5F1}
.stp .val{min-width:44px;font-size:27px;font-weight:800;font-variant-numeric:tabular-nums}
.more{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;display:none}
.more.open{display:block}
.more .f{margin-bottom:8px}
.more label{display:block;font-size:11.5px;font-weight:800;margin-bottom:4px;color:var(--lampd)}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mvbox{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.mv{padding:9px 4px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  font:inherit;font-size:12.5px;font-weight:800;color:var(--mute);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv.on{background:var(--turf);border-color:var(--turf);color:#fff}
.by{font-weight:700;color:var(--blue);font-size:10.5px;margin-left:5px}
.toggle{background:0;border:0;font:inherit;font-size:12px;font-weight:800;color:var(--blue);
  cursor:pointer;padding:8px 0 0}
.acts{display:flex;gap:7px;margin-top:11px}
.acts button{flex:1;padding:11px;border:0;border-radius:11px;font:inherit;font-size:13.5px;
  font-weight:800;cursor:pointer}
.bs{background:var(--turf);color:#fff}
.bd{background:#fff;color:var(--red);border:1.5px solid #EDD3CF!important;flex:0 0 78px}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  font-size:12.5px;line-height:1.65;color:#5C5133;margin:18px 0 0}
.note b{color:var(--ink)}
.empty{text-align:center;color:var(--mute);font-size:13.5px;padding:40px 10px;line-height:1.7}
/* 대여 */
.sizes{display:flex;gap:5px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.sizes::-webkit-scrollbar{display:none}
.sz{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;
  text-align:center;min-width:56px}
.sz b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.sz span{font-size:10.5px;color:var(--mute);font-weight:700}
.sz.hot{border-color:var(--red)}
.r{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:8px}
.r.late{border-color:var(--red);background:#FFF6F5}
.r.back{opacity:.55}
.rhd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.rhd b{font-size:15px;font-weight:800}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b1{background:#FFF1CC;color:#7A5C00}
.b2{background:#DCEBF7;color:var(--blue)}
.b3{background:#E2F0E7;color:var(--turf)}
.rmeta{font-size:12px;color:var(--mute);font-weight:700}
.racts{display:flex;gap:6px;margin-top:9px}
.racts button{flex:1;padding:9px;border:0;border-radius:10px;font:inherit;font-size:12.5px;
  font-weight:800;cursor:pointer}
.rgive{background:var(--blue);color:#fff}
.rback{background:var(--turf);color:#fff}
.rdel{background:#fff;color:var(--red);border:1.5px solid #EDD3CF!important;flex:0 0 62px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);
  background:var(--turf);color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;
  font-weight:800;opacity:0;pointer-events:none;transition:all .22s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--lampd);outline-offset:2px}
</style>

<div id="gate" class="gate">
  <h2>지원단 화면</h2>
  <p>학생기록원과 학교체육지원단만 사용합니다.<br>배부받은 코드를 입력하세요.</p>
  <input id="code" type="password" autocomplete="off" placeholder="코드">
  <button id="enter">들어가기</button><div class="err" id="err"></div>
</div>

<div id="app" hidden>
  <header><div class="in"><h1><span>2026 RAS 2학기 풋살</span>지원단 화면</h1></div></header>

    <select id="dsel"></select>
    <div class="prog" id="prog"></div><div class="bar"><i id="bar" style="width:0%"></i></div>
  </div></div>
  <main class="wrap" id="list"></main>
</div>
<div class="toast" id="toast"></div>

  document.getElementById("tabShoe").className=t==="shoe"?"on":"";
}
function courtsOf(d){return [...new Set(DATA.matches.filter(m=>m.date===d).map(m=>m.court))].sort((a,b)=>a-b)}
function rkey(d,c,r){return d+"|"+c+"|"+r}
function renderRef(){

            const ok=await post({type:"ref",id:rkey(d,c,r),remove:true});
            if(ok){delete refs[rkey(d,c,r)];toast("삭제했습니다")}else toast("삭제 실패");
            render()};
          row.appendChild(b);

  ms.forEach(m=>{
    if(m.slot!==last){last=m.slot;const h=document.createElement("div");h.className="slot";
      h.innerHTML=`${us.indexOf(m.slot)+1}경기 <span>${m.time==="미정"?"시간 미정":m.time}</span>${m.date==="11/21"?' <span style="color:#B8890A">· 본선</span>':''}`;L.appendChild(h)}
    L.appendChild(card(m))});
  const n=document.createElement("div");n.className="note";
  n.innerHTML=`<b>입력 순서</b><br>· 종료 휘슬 직후 점수를 먼저 저장합니다.<br>
    · 그다음 <b>기록 더 남기기</b>를 열어 MVP·한 줄 일지·심판 이름을 씁니다.<br>
    · MVP는 이긴 팀 감독교사가, 무승부면 학생심판이 고릅니다.<br>
    · MVP는 팀을 먼저 누르고 등번호를 적습니다. 이름 대신 번호로 남깁니다.<br>
    · 일지는 한 줄이면 충분합니다. 이 기록이 시즌이 끝나면 대회 기록집이 됩니다.<br>
    · 본선은 무승부가 없습니다. 승부차기까지 끝난 최종 점수를 넣으세요.`;
  L.appendChild(n);
}
function card(m){
  const saved=scores[m.id],lg=logs[m.id]||{},ref=lg.ref||{};
  const mv=mvpPick[m.id]||lg.mvp||{};
  const d=draft[m.id]||(saved?saved.slice():[0,0]);
  const el=document.createElement("div");el.className="g"+(saved?" done":"");
  el.innerHTML=`<div class="ghd"><span class="cid">${COURT[m.court]}구장</span>
    <span class="dv">${DIVLABEL[m.div]} · ${m.grp} ${m.rd}</span>
    <span class="st ${saved?"ok":""}">${saved?"입력 완료":"미입력"}</span></div>
  <div class="teams">
    <div class="tm"><div class="nm">${m.t1}</div><div class="stp">
      <button data-i="0" data-v="-1">−</button><span class="val" id="v0">${d[0]}</span>
      <button data-i="0" data-v="1">+</button></div></div>
    <div class="tm"><div class="nm">${m.t2}</div><div class="stp">
      <button data-i="1" data-v="-1">−</button><span class="val" id="v1">${d[1]}</span>
      <button data-i="1" data-v="1">+</button></div></div></div>
  <button class="toggle">${open[m.id]?"기록 접기":(lg.note||ref.main||lg.video?"남긴 기록 보기":"기록 더 남기기")}</button>
  <div class="more ${open[m.id]?"open":""}">
    <div class="f"><label>MVP<span class="by">${byLabel(m,d)}</span></label>
      <div class="mvbox">
        <button class="mv${mv.team===m.t1?" on":""}" data-t="${esc(m.t1)}">${m.t1}</button>
        <button class="mv${mv.team===m.t2?" on":""}" data-t="${esc(m.t2)}">${m.t2}</button>
      </div>
      <input type="number" class="mvno" inputmode="numeric" min="0" max="99" placeholder="등번호" value="${mv.no??""}"></div>
    <div class="f"><label>한 줄 일지</label>
      <input type="text" class="jot" maxlength="60" placeholder="후반 종료 직전 동점골" value="${esc(lg.note)}"></div>
    <div class="f"><label>심판 · 기록</label><div class="f3">
      <input type="text" class="r1" maxlength="8" placeholder="주심" value="${esc(ref.main)}">
      <input type="text" class="r2" maxlength="8" placeholder="부심" value="${esc(ref.asst)}">
      <input type="text" class="r3" maxlength="8" placeholder="기록" value="${esc(ref.rec)}"></div></div>
    <div class="f"><label>영상 링크</label>
      <input type="url" class="vid" placeholder="https://youtu.be/..." value="${esc(lg.video)}"></div>
  </div>
  <div class="acts">${saved?'<button class="bd">지우기</button>':''}
    <button class="bs">${saved?"수정 저장":"저장"}</button></div>`;
  el.querySelectorAll(".stp button").forEach(b=>{b.onclick=()=>{
    const i=+b.dataset.i,v=+b.dataset.v,cur=draft[m.id]||(saved?saved.slice():[0,0]);
    cur[i]=Math.max(0,Math.min(99,cur[i]+v));draft[m.id]=cur;
    el.querySelector("#v"+i).textContent=cur[i]}});
  el.querySelectorAll(".mv").forEach(b=>{b.onclick=()=>{
    const cur=mvpPick[m.id]||lg.mvp||{};
    mvpPick[m.id]={...cur,team:b.dataset.t};
    el.querySelectorAll(".mv").forEach(x=>x.classList.remove("on"));
    b.classList.add("on")}});
  el.querySelector(".toggle").onclick=()=>{open[m.id]=!open[m.id];render()};
  el.querySelector(".bs").onclick=async e=>{
    const cur=draft[m.id]||(saved?saved.slice():[0,0]);
    e.target.disabled=true;e.target.textContent="저장 중";
    const prev=scores[m.id];scores[m.id]=[cur[0],cur[1]];
    const note=el.querySelector(".jot").value.trim();
    const r1=el.querySelector(".r1").value.trim(),r2=el.querySelector(".r2").value.trim(),
          r3=el.querySelector(".r3").value.trim(),vid=el.querySelector(".vid").value.trim();
    if(note||r1||r2||r3||vid) logs[m.id]={note,ref:{main:r1,asst:r2,rec:r3},video:vid};
    else delete logs[m.id];
    const ok=await put(K_SC,scores)&&await put(K_LOG,logs);
    if(ok){delete draft[m.id];open[m.id]=false;toast(`${m.t1} ${cur[0]} : ${cur[1]} ${m.t2} 저장`)}
    else{if(prev)scores[m.id]=prev;else delete scores[m.id];toast("저장 실패 · 다시 눌러 주세요")}
    render()};
  const bd=el.querySelector(".bd");
  if(bd) bd.onclick=async()=>{
    if(!confirm(`${m.t1} : ${m.t2} 기록을 지울까요?`))return;
    delete scores[m.id];delete logs[m.id];delete draft[m.id];
    await put(K_SC,scores);await put(K_LOG,logs);toast("기록을 지웠습니다");render()};
  return el;
}

/* ── 풋살화 대여 ── */
function renderShoe(){
  document.getElementById("recCtrl").hidden=true;
  tabClass("shoe");
  const L=document.getElementById("list");L.innerHTML="";
  const all=Object.entries(shoes).sort((a,b)=>(a[1].at<b[1].at?-1:1));
  const out=all.filter(([,s])=>s.status==="지급완료");
  const wait=all.filter(([,s])=>s.status==="신청");
  const back=all.filter(([,s])=>s.status==="반납완료");

  const head=document.createElement("div");
  head.innerHTML=`<div class="slot" style="margin-top:14px">사이즈별 대여 중</div>`;
  const sz=document.createElement("div");sz.className="sizes";
  for(let i=230;i<=290;i+=5){
    const c=out.filter(([,s])=>s.size===i).length;
    const w=wait.filter(([,s])=>s.size===i).length;
    const d=document.createElement("div");d.className="sz"+(c>=3?" hot":"");
    d.innerHTML=`<b>${c}</b><span>${i}mm${w?" · 대기 "+w:""}</span>`;sz.appendChild(d)}
  L.appendChild(head);L.appendChild(sz);

  section(L,"신청 · 아직 안 줌",wait,"b1");
  section(L,"지급 완료 · 반납 대기",out,"b2");
  section(L,"반납 완료",back,"b3");

  if(!all.length) L.innerHTML+='<div class="empty">아직 신청이 없습니다.<br>학생은 대회 사이트 안내 화면에서 신청합니다.</div>';

  const n=document.createElement("div");n.className="note";
  n.innerHTML=`<b>운영 방법</b><br>· <b>경기 시작 10분 전부터</b> 본부에서 건네고 <b>지급 완료</b>를 누릅니다.<br>
    · <b>경기가 끝나면 즉시</b> 돌려받고 <b>반납 완료</b>를 누릅니다.<br>
    · 한 켤레를 여러 학생이 나눠 신습니다. 반납이 늦으면 다음 경기 학생이 못 신습니다.<br>
    · 그날 반납되지 않은 건은 빨간 테두리로 남으니 마감 전에 확인하세요.<br>
    · 이름과 학년반은 대여 확인에만 씁니다. 대회가 끝나면 목록을 지워 주세요.`;
  L.appendChild(n);
}
function section(L,title,arr,cls){
  if(!arr.length)return;
  const h=document.createElement("div");h.className="slot";
  h.innerHTML=`${title} <span>${arr.length}건</span>`;L.appendChild(h);
  arr.forEach(([id,s])=>{
    const late=s.status==="지급완료"&&cmp(s.date,today())<0;
    const el=document.createElement("div");
    el.className="r"+(late?" late":"")+(s.status==="반납완료"?" back":"");
    el.innerHTML=`<div class="rhd"><b>${esc(s.name)}</b>
      <span class="badge ${cls}">${s.status}${late?" · 미반납":""}</span></div>
      <div class="rmeta">${esc(s.school)} ${esc(s.klass)} · ${s.size}mm · ${esc(s.date)} 경기</div>
      <div class="racts"></div>`;
    const acts=el.querySelector(".racts");
    if(s.status==="신청"){
      const b=document.createElement("button");b.className="rgive";b.textContent="지급 완료";
      b.onclick=()=>setStatus(id,"지급완료");acts.appendChild(b)}
    if(s.status==="지급완료"){
      const b=document.createElement("button");b.className="rback";b.textContent="반납 완료";
      b.onclick=()=>setStatus(id,"반납완료");acts.appendChild(b)}
    if(s.status==="반납완료"){
      const b=document.createElement("button");b.className="rgive";b.textContent="되돌리기";
      b.onclick=()=>setStatus(id,"지급완료");acts.appendChild(b)}
    const d=document.createElement("button");d.className="rdel";d.textContent="삭제";
    d.onclick=async()=>{if(!confirm(`${s.name} 신청을 삭제할까요?`))return;
      delete shoes[id];await put(K_SHOE,shoes);toast("삭제했습니다");render()};
    acts.appendChild(d);
    L.appendChild(el)});
}
async function setStatus(id,st){
  shoes[id].status=st;
  const ok=await put(K_SHOE,shoes);
  toast(ok?shoes[id].name+" · "+st:"저장 실패 · 다시 시도하세요");render();
}

function render(){tab==="rec"?renderRec():tab==="ref"?renderRef():renderShoe()}
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&!document.getElementById("app").hidden)load()});
</script>
